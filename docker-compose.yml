services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sindhudurg_marketplace_web
    ports:
      - "3000:3000"
    environment:
      - VITE_APP_ENV=${VITE_APP_ENV:-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
